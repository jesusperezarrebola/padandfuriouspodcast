<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pad & Furious | Podcast</title>
    <style>
        :root {
            --rojo: #FF3D00;
            --naranja: #FF9100;
            --amarillo: #FFEA00;
            --oscuro: #121212;
            --gris-card: #1E1E1E;
        }

        body {
            background-color: var(--oscuro);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { text-align: center; padding: 20px 0 40px 0; }
        .logo-img { max-width: 180px; filter: drop-shadow(0px 0px 15px var(--rojo)); margin-bottom: 10px; }
        h1 { font-size: 3rem; color: var(--amarillo); text-transform: uppercase; text-shadow: 4px 4px 0px var(--rojo); margin: 0; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: var(--gris-card);
            border: 4px solid var(--rojo);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 8px 8px 0px var(--naranja);
            display: flex;
            flex-direction: column;
        }

        .card h2 { color: var(--amarillo); margin-top: 0; }
        .btn-download {
            margin-top: 15px;
            background: var(--rojo);
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            border-bottom: 4px solid #900;
        }

        iframe { border-radius: 12px; border: none; margin-top: 10px; }
        #error-display { background: #441111; color: #ffaaaa; padding: 20px; border-radius: 10px; display: none; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Pad & Furious" class="logo-img">
        <h1>PAD & FURIOUS</h1>
    </header>

    <div id="error-display"></div>
    <div id="loading" style="color: var(--amarillo); font-weight: bold;">Cargando episodios...</div>
    <div class="grid" id="podcast-container"></div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9gFu8RzmdEpjIH1zy4jawppY8Q_5jTZFYHaaUbP0PVbq1auKHp1UtuW521hxrjLVC-wrM3SGItmg1/pub?output=csv';

        // FUNCIÓN MAESTRA PARA LEER CSV CON COMAS
        function parseCSV(text) {
            const result = [];
            let row = [''];
            let inQuotes = false;
            let i = 0;

            for (let char of text) {
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push('');
                } else if (char === '\n' && !inQuotes) {
                    result.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += char;
                }
            }
            result.push(row);
            return result;
        }

        async function loadEpisodes() {
            try {
                const response = await fetch(`${SHEET_URL}&cb=${Date.now()}`);
                const rawText = await response.text();
                const data = parseCSV(rawText);
                
                const container = document.getElementById('podcast-container');
                document.getElementById('loading').style.display = 'none';

                // Empezamos en 1 para saltar la cabecera del Excel
                for (let i = 1; i < data.length; i++) {
                    const columns = data[i];
                    if (columns.length < 3 || !columns[0]) continue;

                    const [titulo, descripcion, spotify_id, drive_link] = columns;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h2>${titulo.trim()}</h2>
                        <p>${descripcion.trim()}</p>
                        <iframe src="https://open.spotify.com/embed/episode/${spotify_id.trim()}?utm_source=generator&theme=0" width="100%" height="152" allow="encrypted-media"></iframe>
                        <a href="${drive_link ? drive_link.trim() : '#'}" target="_blank" class="btn-download">📥 DESCARGAR MP3</a>
                    `;
                    container.appendChild(card);
                }
            } catch (error) {
                document.getElementById('error-display').style.display = 'block';
                document.getElementById('error-display').innerHTML = "Error cargando datos: " + error.message;
            }
        }

        loadEpisodes();
    </script>
</body>
</html>
