<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pad & Furious | Podcast</title>
    <style>
        :root {
            --rojo: #FF3D00;
            --naranja: #FF9100;
            --amarillo: #FFEA00;
            --oscuro: #121212;
            --gris-card: #1E1E1E;
        }

        body {
            background-color: var(--oscuro);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        h1 {
            font-size: 3rem;
            color: var(--amarillo);
            text-transform: uppercase;
            text-shadow: 4px 4px 0px var(--rojo);
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: var(--gris-card);
            border: 4px solid var(--rojo);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 8px 8px 0px var(--naranja);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 12px 12px 0px var(--amarillo);
        }

        .card h2 {
            margin-top: 0;
            color: var(--amarillo);
            font-size: 1.4rem;
        }

        .card p {
            color: #bbb;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .btn-download {
            margin-top: auto;
            background: var(--rojo);
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 4px solid #900;
        }

        .btn-download:hover { background: #ff5722; }

        iframe { margin: 15px 0; border-radius: 12px; }

        #loading { color: var(--amarillo); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>PAD & FURIOUS</h1>
        <p>El repositorio oficial para los que le dan furiosamente al pad.</p>
    </header>

    <div id="loading">Cargando episodios cargados de furia...</div>
    <div class="grid" id="podcast-container"></div>

    <script>
        // PEGA AQUÍ TU URL DE "PUBLICAR EN LA WEB" (FORMATO CSV)
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9gFu8RzmdEpjIH1zy4jawppY8Q_5jTZFYHaaUbP0PVbq1auKHp1UtuW521hxrjLVC-wrM3SGItmg1/pub?output=csv';

        async function loadEpisodes() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // Ignorar cabecera
                const container = document.getElementById('podcast-container');
                document.getElementById('loading').style.display = 'none';

                rows.forEach(row => {
                    const [titulo, descripcion, spotify_id, drive_link] = row.split(',');
                    if (!titulo) return;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h2>${titulo}</h2>
                        <p>${descripcion}</p>
                        <iframe src="https://open.spotify.com/embed/episode/${spotify_id.trim()}?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allow="encrypted-media"></iframe>
                        <a href="${drive_link.trim()}" target="_blank" class="btn-download">📥 DESCARGAR MP3</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error cargando el podcast:', error);
                document.getElementById('loading').innerText = 'Error al cargar los episodios.';
            }
        }

        loadEpisodes();
    </script>
</body>
</html>
