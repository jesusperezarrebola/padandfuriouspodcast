<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pad & Furious | Podcast</title>
    <style>
        :root {
            --rojo: #FF3D00;
            --naranja: #FF9100;
            --amarillo: #FFEA00;
            --oscuro: #121212;
            --gris-card: #1E1E1E;
            --bluesky: #0085ff;
        }

        body {
            background-color: var(--oscuro);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { text-align: center; padding: 10px 0 20px 0; }
        .logo-img { max-width: 150px; filter: drop-shadow(0px 0px 15px var(--rojo)); margin-bottom: 5px; }
        h1 { font-size: 2.5rem; color: var(--amarillo); text-transform: uppercase; text-shadow: 3px 3px 0px var(--rojo); margin: 0; }
        
        /* --- REDES SOCIALES --- */
        .social-bar { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
        .social-link {
            text-decoration: none; color: white; padding: 10px 20px; border-radius: 10px;
            font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.3s;
            border-bottom: 4px solid rgba(0,0,0,0.3); text-transform: uppercase; font-size: 0.8rem;
        }
        .link-spotify { background: #1DB954; }
        .link-bluesky { background: var(--bluesky); }
        .social-link:hover { transform: translateY(-3px); filter: brightness(1.1); }

        /* --- FILTROS --- */
        .filter-container {
            background: var(--gris-card);
            padding: 15px 25px;
            border-radius: 20px;
            border: 2px solid var(--naranja);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            background: var(--oscuro);
            color: var(--amarillo);
            border: 2px solid var(--rojo);
            cursor: pointer;
            font-weight: bold;
        }

        .checkbox-group { display: flex; gap: 15px; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .checkbox-item input { accent-color: var(--rojo); width: 16px; height: 16px; }

        /* --- GRID Y CARDS --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: var(--gris-card);
            border: 4px solid var(--rojo);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 8px 8px 0px var(--naranja);
            display: flex;
            flex-direction: column;
            /* Animación de entrada al cargar */
            animation: fadeIn 0.4s ease forwards;
            /* Transición suave para el efecto hover */
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
        }

        /* EL EFECTO RECUPERADO Y MEJORADO */
        .card:hover {
            transform: scale(1.03) translateY(-5px);
            box-shadow: 12px 12px 0px var(--amarillo);
            border-color: var(--amarillo);
            filter: brightness(1.1);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card h2 { color: var(--amarillo); font-size: 1.3rem; margin-top: 0; }
        
        .badge {
            display: inline-block;
            background: var(--naranja);
            color: black;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .nitro-badge { background: var(--amarillo); box-shadow: 0 0 10px var(--amarillo); }

        .btn-download {
            margin-top: auto; background: var(--rojo); color: white;
            text-align: center; text-decoration: none; padding: 12px;
            border-radius: 10px; font-weight: bold; text-transform: uppercase;
            border-bottom: 4px solid #900;
        }

        #load-more-btn {
            margin: 40px 0; background: var(--amarillo); color: var(--oscuro);
            border: none; padding: 15px 40px; font-size: 1.1rem; font-weight: bold;
            text-transform: uppercase; border-radius: 50px; cursor: pointer;
            box-shadow: 0px 0px 15px var(--rojo); display: none;
        }

        iframe { border-radius: 12px; border: none; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Pad & Furious" class="logo-img">
        <h1>PAD & FURIOUS</h1>
    </header>

    <div class="social-bar">
        <a href="https://open.spotify.com/show/1wra6rQEeUQzo8dTKCKfOC?si=ba79df05f9e2496c" class="link-spotify social-link" target="_blank">🎧 Spotify</a>
        <a href="https://bsky.app/profile/padandfurious.bsky.social" class="link-bluesky social-link" target="_blank">🦋 Bluesky</a>
    </div>

    <div class="filter-container">
        <div>
            <label style="font-weight: bold; font-size: 0.9rem;">TEMPORADA: </label>
            <select id="season-select"></select>
        </div>
        <div class="checkbox-group">
            <label class="checkbox-item">
                <input type="checkbox" id="check-normal" checked> Episodios
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="check-nitro" checked> Nitros
            </label>
        </div>
    </div>

    <div id="loading" style="color: var(--amarillo); font-weight: bold;">SINTONIZANDO REPOSITORIO...</div>
    <div class="grid" id="podcast-container"></div>
    <button id="load-more-btn">Ver más capítulos</button>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9gFu8RzmdEpjIH1zy4jawppY8Q_5jTZFYHaaUbP0PVbq1auKHp1UtuW521hxrjLVC-wrM3SGItmg1/pub?output=csv';
        
        let allData = [];
        let filteredEpisodes = [];
        let currentIndex = 0;
        const EPISODES_PER_PAGE = 6;

        function parseCSV(text) {
            const result = [];
            let row = [''];
            let inQuotes = false;
            for (let char of text) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) row.push('');
                else if (char === '\n' && !inQuotes) { result.push(row); row = ['']; }
                else row[row.length - 1] += char;
            }
            result.push(row);
            return result;
        }

        function applyFilters() {
            const season = document.getElementById('season-select').value;
            const showNormal = document.getElementById('check-normal').checked;
            const showNitro = document.getElementById('check-nitro').checked;

            filteredEpisodes = allData.filter(ep => {
                const epSeason = ep[4] ? ep[4].trim() : "";
                const isNitro = ep[5] ? ep[5].trim().toLowerCase() === "si" : false;
                const matchSeason = epSeason === season;
                const matchType = (isNitro && showNitro) || (!isNitro && showNormal);
                return matchSeason && matchType;
            });

            currentIndex = 0;
            document.getElementById('podcast-container').innerHTML = "";
            renderNextBatch();
        }

        function renderNextBatch() {
            const container = document.getElementById('podcast-container');
            const nextBatch = filteredEpisodes.slice(currentIndex, currentIndex + EPISODES_PER_PAGE);
            
            nextBatch.forEach(columns => {
                const [titulo, descripcion, spotify_id, drive_link, temporada, esNitro] = columns;
                const isNitro = esNitro && esNitro.trim().toLowerCase() === "si";
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <span class="badge ${isNitro ? 'nitro-badge' : ''}">${isNitro ? '🔥 NITRO' : '🕹️ Episodio'}</span>
                    </div>
                    <h2>${titulo.trim()}</h2>
                    <p>${descripcion.trim()}</p>
                    <iframe src="https://open.spotify.com/embed/episode/${spotify_id.trim()}?utm_source=generator&theme=0" width="100%" height="152" allow="encrypted-media"></iframe>
                    <a href="${drive_link ? drive_link.trim() : '#'}" target="_blank" class="btn-download">📥 DESCARGAR MP3</a>
                `;
                container.appendChild(card);
            });

            currentIndex += EPISODES_PER_PAGE;
            const btn = document.getElementById('load-more-btn');
            btn.style.display = currentIndex >= filteredEpisodes.length ? 'none' : 'block';
        }

        async function init() {
            try {
                const response = await fetch(`${SHEET_URL}&cb=${Date.now()}`);
                const rawText = await response.text();
                const data = parseCSV(rawText);
                
                allData = data.slice(1).filter(row => row[0] && row[0].trim() !== "");

                const seasons = [...new Set(allData.map(ep => ep[4] ? ep[4].trim() : "").filter(s => s !== ""))];
                seasons.sort((a, b) => b - a);

                const select = document.getElementById('season-select');
                seasons.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = `Temporada ${s}`;
                    select.appendChild(opt);
                });

                document.getElementById('loading').style.display = 'none';

                select.addEventListener('change', applyFilters);
                document.getElementById('check-normal').addEventListener('change', applyFilters);
                document.getElementById('check-nitro').addEventListener('change', applyFilters);

                applyFilters();

            } catch (error) {
                console.error(error);
            }
        }

        document.getElementById('load-more-btn').addEventListener('click', renderNextBatch);
        init();
    </script>
</body>
</html>
